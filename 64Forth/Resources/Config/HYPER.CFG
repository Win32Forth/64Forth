# HYPER.CFG — 64Forth hypertext index compiler rules (Phase 1 / 3a)
# ----------------------------------------------------------------
# Primary consumer: tools/build_hyper_index.py (full offline index).
# Phase 3a HYPER-REINDEX (Library/Hyper/hyper-index.fth) uses a fixed
# SPECS subset and the same TYPE 0 spirit; it does not parse this file yet.
#
# Lines: blank and # comments ignored.
# Directives are case-insensitive keywords at line start.
#
# Rebuild index (offline, full):
#   python3 tools/build_hyper_index.py
# (from repo root; --src-root defaults to ./64Forth)
#
# Rebuild index (in-app, cwd HYPER.NDX):
#   FROMLIB FLOAD Hyper/hyper.fth   then   HYPER-REINDEX

# File globs relative to --src-root (default: <repo>/64Forth).
# Multiple SPECS lines accumulate. Builder expands globs.
# Library sources live under Resources/Library/; NDX rewrites them to Library/.
SPECS Kernel/forth.s
SPECS Kernel/boot_words.inc
SPECS Kernel/colon_words.inc
SPECS Resources/Library/**/*.fth
SPECS Resources/Library/**/*.FTH

# Paths under Library that should not be indexed (noise / tests).
# Filenames or path substrings; exact rules defined by the builder.
*EXCLUDE HayesTest
*EXCLUDE ANSValidate
*EXCLUDE Benchmarks
*EXCLUDE HYPER.NDX

# Keep relative paths in the NDX (recommended ON).
KEEPPATH ON

# Block files (legacy Forth screens) — off for 64Forth.
BLOCKFILE OFF

# Column window for pattern search on each line (0-based after expand tabs).
AFTER 0
BEFORE 200
LINEMAX 500

# Stop scanning a line at a Forth line comment (space-backslash or start).
STOPAT \

# Source may contain tabs.
TABX ON

# ----------------------------------------------------------------
# TYPE rules (up to 16). TYPE n "string"
#
#   TYPE 0 "prefix"  — index the word *after* the prefix on the line.
#                      Include a trailing space when the keyword is
#                      space-delimited (e.g. ": " not ":").
#   TYPE 1 ":"       — index word *before* a trailing colon (asm labels).
#   TYPE 2 "str "    — index word at start of line before string (asm LABEL).
#   TYPE 4 "str "    — index word following string at line start.
#   TYPE 5 "hdr ,,"  — delimited parse (see NEWZ HYPER.DOC); unused for now.
# ----------------------------------------------------------------

# Forth defining words (TYPE 0 — name follows keyword + space)
TYPE 0 ": "
TYPE 0 "CODE "
TYPE 0 "CREATE "
TYPE 0 "CONSTANT "
TYPE 0 "VALUE "
TYPE 0 "2VALUE "
TYPE 0 "DEFER "
TYPE 0 "VARIABLE "
TYPE 0 "VOCABULARY "
TYPE 0 "BUFFER: "
TYPE 0 "SYNONYM "
TYPE 0 "ALIAS "

# 64Forth CODE headers (co-located with X* / DO* labels in Kernel/forth.s)
TYPE 0 "BOOT_WORD \""

# Optional: help attach sites (may index DOC" name if present on same line)
# TYPE 0 "DOC\" "

# Assembler public entry labels (optional secondary; prefer BOOT_WORD when co-located)
# TYPE 1 ":"

# End of TYPE list (optional sentinel for F-PC-style parsers)
;
